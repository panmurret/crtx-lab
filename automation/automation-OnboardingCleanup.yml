comment: "Cleanup the incidents and indicators created by OnboardingIntegration\n\nThis
  automation runs using the default Limited User role, unless you explicitly change
  the permissions.\nFor more information, see the section about permissions here:\n-
  For Cortex XSOAR 6 see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/6.x/Cortex-XSOAR-Playbook-Design-Guide/Automations
  \n- For Cortex XSOAR 8 Cloud see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8/Cortex-XSOAR-Cloud-Documentation/Create-a-script\n-
  For Cortex XSOAR 8.7 On-prem see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8.7/Cortex-XSOAR-On-prem-Documentation/Create-a-script"
commonfields:
  id: OnboardingCleanup
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    itemVersion: 1.1.9
    packID: OnboardingIntegration
    packName: OnboardingIntegration
    packPropagationLabels:
    - all
    prevname: ""
